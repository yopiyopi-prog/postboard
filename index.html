<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
 <link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png"> <title>PostBoard - SNS投稿管理カレンダー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #F0F4F8; font-family: 'Hiragino Sans','Noto Sans JP',sans-serif; color: #1a2a3a; }
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
    textarea, input, select, button { font-family: inherit; }
    textarea { -webkit-user-select: text !important; user-select: text !important; }
    input { -webkit-user-select: text !important; user-select: text !important; }

    /* Header */
    .header { background:#fff; border-bottom:1px solid #E2E8F0; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .header-title { font-size:19px; font-weight:800; color:#6C63FF; letter-spacing:-0.5px; }
    .header-sub { font-size:10px; color:#94A3B8; }
    .header-badges { display:flex; gap:8px; }
    .badge-fire { background:#FFF7F5; border:1px solid #FDBA74; border-radius:20px; padding:4px 10px; font-size:12px; color:#EA580C; font-weight:700; }
    .badge-post { background:#EEF2FF; border:1px solid #A5B4FC; border-radius:20px; padding:4px 10px; font-size:12px; color:#6C63FF; font-weight:700; }

    /* Mascot */
    .mascot { margin:12px 12px 0; background:linear-gradient(135deg,#EEF2FF,#F5F3FF); border:1px solid #C7D2FE; border-radius:14px; padding:12px 14px; display:flex; align-items:flex-start; gap:10px; }
    .mascot-icon { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .mascot-crown { font-size:10px; color:#6C63FF; font-weight:700; }
    .mascot-frog { font-size:30px; line-height:1; }
    .mascot-name { font-size:8px; color:#6C63FF; font-weight:700; white-space:nowrap; }
    .mascot-bubble { position:relative; background:#fff; border-radius:12px; padding:8px 12px; border:1px solid #C7D2FE; flex:1; }
    .mascot-bubble::before { content:''; position:absolute; left:-7px; top:12px; width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-right:7px solid #C7D2FE; }
    .mascot-bubble::after { content:''; position:absolute; left:-5px; top:13px; width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:6px solid #fff; }
    .mascot-label { font-size:9px; color:#6C63FF; font-weight:700; margin-bottom:3px; }
    .mascot-msg { font-size:12px; color:#3730A3; line-height:1.6; }

    /* Nav */
    .nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:#fff; border-top:1px solid #E2E8F0; display:flex; z-index:100; }
    .nav-btn { flex:1; padding:10px 0 6px; border:none; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; }
    .nav-icon { font-size:18px; }

    /* Card */
    .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,0.07); }

    /* Calendar */
    .cal-wrap { padding:0 12px 12px; }
    .cal-nav { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; }
    .cal-nav-btn { width:32px; height:32px; border-radius:8px; border:1px solid #E2E8F0; background:#fff; cursor:pointer; color:#64748B; font-size:18px; }
    .cal-title { font-size:17px; font-weight:700; }
    .cal-grid { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
    .cal-head { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid #F1F5F9; }
    .cal-head-day { text-align:center; font-size:11px; font-weight:700; padding:8px 0; }
    .cal-days { display:grid; grid-template-columns:repeat(7,1fr); }
    .cal-day { min-height:62px; padding:5px 4px; cursor:pointer; border-bottom:1px solid #F1F5F9; }
    .cal-day-num { font-size:12px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .cal-day-buzz { font-size:9px; font-weight:700; margin-top:2px; }
    .cal-day-dots { display:flex; gap:1px; margin-top:1px; }
    .cal-day-dot { width:5px; height:5px; border-radius:50%; }

    /* Legend */
    .legend { margin-top:10px; }
    .legend-title { font-size:11px; color:#64748B; margin-bottom:5px; font-weight:600; }
    .legend-items { display:flex; gap:8px; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:4px; font-size:10px; color:#64748B; }
    .legend-dot { width:10px; height:10px; border-radius:2px; }

    /* FAB */
    .fab { position:fixed; bottom:80px; right:20px; width:52px; height:52px; border-radius:50%; background:#6C63FF; border:none; color:#fff; font-size:26px; cursor:pointer; box-shadow:0 4px 16px rgba(108,99,255,0.45); z-index:50; display:flex; align-items:center; justify-content:center; }

    /* Detail panel */
    .detail-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .detail-title { font-weight:700; font-size:15px; }
    .record-btn { background:#6C63FF; border:none; border-radius:20px; color:#fff; padding:7px 16px; font-size:13px; cursor:pointer; font-weight:700; }
    .post-item { background:#F8FAFC; border-radius:12px; padding:10px 12px; margin-bottom:8px; }
    .post-item-inner { display:flex; justify-content:space-between; align-items:center; }
    .post-item-left { display:flex; align-items:center; gap:8px; }
    .post-item-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .post-item-name { font-size:11px; font-weight:700; }
    .post-item-memo { font-size:12px; color:#64748B; }
    .post-item-likes { font-size:14px; font-weight:700; text-align:right; }
    .post-item-buzz { font-size:9px; font-weight:700; text-align:right; }
    .no-post { text-align:center; color:#94A3B8; padding:20px 0; font-size:13px; }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.5); display:flex; align-items:flex-end; z-index:200; }
    .modal-box { width:100%; background:#fff; border-radius:24px 24px 0 0; padding:24px 20px 36px; max-height:92vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .modal-title { font-size:16px; font-weight:700; }
    .modal-close { width:28px; height:28px; border-radius:50%; background:#F1F5F9; border:none; cursor:pointer; font-size:14px; color:#64748B; }
    .modal-label { font-size:12px; color:#64748B; font-weight:600; margin-bottom:6px; }
    .modal-input { width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid #E2E8F0; font-size:14px; box-sizing:border-box; color:#1a2a3a; background:#fff; outline:none; }
    .modal-select { width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid #E2E8F0; font-size:14px; box-sizing:border-box; color:#1a2a3a; background:#fff; outline:none; }
    .plat-btns { display:flex; gap:6px; flex-wrap:wrap; }
    .plat-btn { padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .save-btn { width:100%; padding:14px; background:#6C63FF; border:none; border-radius:14px; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }

    /* Analytics */
    .analytics-wrap { padding:12px 12px 0; }
    .section-title { font-size:15px; font-weight:700; margin-bottom:10px; }
    .pill-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .heatmap-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .heatmap-head { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px; }
    .hm-day-label { text-align:center; font-size:10px; font-weight:700; }
    .hm-cell { aspect-ratio:1; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; }
    .week-grid-row { display:grid; grid-template-columns:42px repeat(7,1fr); gap:2px; margin-bottom:2px; }
    .week-label { font-size:8px; color:#94A3B8; line-height:1.3; white-space:pre-line; display:flex; align-items:center; }
    .legend-bar { display:flex; align-items:center; gap:4px; margin-top:8px; justify-content:flex-end; }
    .legend-box { width:10px; height:10px; border-radius:2px; }

    /* Follower graph */
    .fw-note { font-size:13px; font-weight:700; margin-bottom:8px; }
    .fw-sub { font-size:11px; color:#94A3B8; font-weight:400; margin-left:8px; }
    .fw-chart { position:relative; height:130px; }
    .fw-label { position:absolute; top:4px; right:0; color:#fff; border-radius:8px; padding:4px 10px; font-size:13px; font-weight:700; text-align:center; }
    .fw-xlabel { display:flex; justify-content:space-between; margin-bottom:10px; }
    .fw-xlabel span { font-size:8px; color:#94A3B8; }
    .fw-goal-box { background:#F8FAFC; border-radius:10px; padding:10px 12px; }
    .fw-goal-row { display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; }
    .fw-bar-bg { background:#E2E8F0; border-radius:6px; height:8px; overflow:hidden; }
    .fw-bar-fill { height:100%; border-radius:6px; }
    .fw-goal-note { font-size:11px; color:#94A3B8; margin-top:5px; }

    /* Streak */
    .streak-center { text-align:center; margin-bottom:14px; }
    .streak-num { font-size:52px; font-weight:900; color:#FF6B35; line-height:1; }
    .streak-label { font-size:15px; color:#64748B; margin-top:4px; }
    .streak-best { font-size:12px; color:#94A3B8; margin-top:2px; }
    .streak-dots { display:flex; justify-content:center; gap:8px; margin-bottom:14px; }
    .streak-dot-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .streak-dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
    .streak-day { font-size:9px; color:#94A3B8; }
    .streak-bars { display:flex; align-items:flex-end; gap:4px; height:60px; }
    .streak-bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .streak-bar { width:100%; border-radius:4px 4px 0 0; }
    .streak-bar-label { font-size:9px; color:#94A3B8; }
    .streak-msg { margin-top:10px; background:#FFF7F5; border-radius:10px; padding:9px 12px; font-size:12px; color:#FF6B35; font-weight:700; text-align:center; }

    /* Accounts */
    .acc-wrap { padding:12px 12px 0; }
    .acc-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .acc-header-title { font-size:15px; font-weight:700; }
    .acc-add-btn { background:#6C63FF; border:none; border-radius:20px; color:#fff; padding:7px 16px; font-size:13px; font-weight:700; cursor:pointer; }
    .acc-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    .acc-edit-row { display:flex; align-items:center; gap:8px; }
    .acc-plat-btns { display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }
    .acc-plat-btn { padding:4px 8px; border-radius:6px; font-size:13px; cursor:pointer; }
    .acc-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
    .acc-stat { background:#F8FAFC; border-radius:10px; padding:8px; text-align:center; }
    .acc-stat-val { font-size:16px; font-weight:700; }
    .acc-stat-label { font-size:10px; color:#94A3B8; margin-top:1px; }
    .acc-fw-row { display:flex; justify-content:space-between; font-size:11px; color:#94A3B8; margin-bottom:4px; }
    .acc-bar-bg { background:#F1F5F9; border-radius:6px; height:7px; overflow:hidden; }
    .acc-bar-fill { height:100%; border-radius:6px; }
    .acc-del-btn { margin-top:8px; padding:4px 10px; border-radius:6px; background:#FFF5F5; border:1px solid #FECACA; color:#EF4444; font-size:11px; cursor:pointer; }
    .acc-input-label { font-size:11px; color:#94A3B8; margin-bottom:5px; font-weight:600; }
    .acc-textarea { width:100%; padding:10px 12px; font-size:16px; border-radius:10px; border:1.5px solid #E2E8F0; outline:none; color:#1a2a3a; background:#fff; box-sizing:border-box; resize:none; font-family:inherit; line-height:1.4; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
const PLATFORMS = [
  {id:'threads',   name:'Threads',   color:'#000000', emoji:'🧵'},
  {id:'instagram', name:'Instagram', color:'#E1306C', emoji:'📸'},
  {id:'tiktok',    name:'TikTok',    color:'#010101', emoji:'🎵'},
  {id:'youtube',   name:'YouTube',   color:'#FF0000', emoji:'▶️'},
  {id:'twitter',   name:'X',         color:'#1DA1F2', emoji:'𝕏'},
];
const DEFAULT_ACCOUNTS = [
  {id:'acc1',name:'アカウント1',platform:'threads',  color:'#6C63FF'},
  {id:'acc2',name:'アカウント2',platform:'instagram',color:'#E1306C'},
  {id:'acc3',name:'アカウント3',platform:'tiktok',   color:'#555555'},
  {id:'acc4',name:'アカウント4',platform:'youtube',  color:'#FF0000'},
  {id:'acc5',name:'アカウント5',platform:'twitter',  color:'#1DA1F2'},
];
const MASCOT_MESSAGES = [
  '今日はまだ投稿してないワよ！コツコツ続けるのが女王の流儀ですわ👑',
  '3日連続投稿！すごいじゃないの！この調子でいくわよ🔥',
  '1週間連続！アテクシも鼻が高いわ！さすがですわ👑✨',
  '目標まであと少しよ！諦めたら終わりですわ📈',
  '今日バズってるじゃないの！勢いに乗って次も投稿しちゃいなさい🚀',
  '今週はよく投稿できてるわね！フォロワーも増えそうでうれしいわ😄',
];
const DAYS = ['日','月','火','水','木','金','土'];

function getBuzz(likes){
  if(likes>=301)return{label:'爆バズ',color:'#FF4500',bg:'#FFF0EB'};
  if(likes>=101)return{label:'バズ',  color:'#FF8C00',bg:'#FFF8ED'};
  if(likes>=31) return{label:'好調',  color:'#F59E0B',bg:'#FFFBEB'};
  if(likes>=11) return{label:'',      color:'#6C63FF',bg:'#EEF2FF'};
  return{label:'',color:'#CBD5E1',bg:'#F8FAFC'};
}

function load(key,def){try{const s=localStorage.getItem(key);return s?JSON.parse(s):def;}catch{return def;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

// Reset on version change
const VERSION='v2.0';
if(localStorage.getItem('pb_version')!==VERSION){
  ['pb_postData','pb_accounts','pb_followerData','pb_streak','pb_bestStreak'].forEach(k=>localStorage.removeItem(k));
  localStorage.setItem('pb_version',VERSION);
}

const defaultFollower={
  acc1:{current:0,goal:1000,history:[0,0,0,0,0,0,0]},
  acc2:{current:0,goal:1000,history:[0,0,0,0,0,0,0]},
  acc3:{current:0,goal:1000,history:[0,0,0,0,0,0,0]},
  acc4:{current:0,goal:1000,history:[0,0,0,0,0,0,0]},
  acc5:{current:0,goal:1000,history:[0,0,0,0,0,0,0]},
};

let state={
  view:'calendar',
  year:new Date().getFullYear(),
  month:new Date().getMonth(),
  selectedDay:null,
  postData:load('pb_postData',{}),
  accounts:load('pb_accounts',DEFAULT_ACCOUNTS),
  followerData:load('pb_followerData',defaultFollower),
  streak:load('pb_streak',0),
  bestStreak:load('pb_bestStreak',0),
  showModal:false,
  newPost:{accountId:'acc1',platform:'threads',likes:'',content:'',time:''},
  editingId:null,
  hmFilter:'all',
  weekMode:'posts',
  fwAccId:'acc1',
};

function setState(updates){
  Object.assign(state,updates);
  if(updates.postData!==undefined)save('pb_postData',state.postData);
  if(updates.accounts!==undefined)save('pb_accounts',state.accounts);
  if(updates.followerData!==undefined)save('pb_followerData',state.followerData);
  if(updates.streak!==undefined)save('pb_streak',state.streak);
  if(updates.bestStreak!==undefined)save('pb_bestStreak',state.bestStreak);
  render();
}

function getDayKey(y,m,d){return `${y}-${m+1}-${d}`;}

function pill(label,active,color='#6C63FF',onclick){
  const btn=document.createElement('button');
  btn.textContent=label;
  btn.style.cssText=`padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:${active?700:400};background:${active?color:'#F1F5F9'};border:1px solid ${active?color:'#E2E8F0'};color:${active?'#fff':'#64748B'};`;
  btn.onclick=onclick;
  return btn;
}

function el(tag,cls,html){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html;
  return e;
}

function renderCalendar(){
  const wrap=el('div','cal-wrap');
  const {year,month,selectedDay,postData,accounts}=state;
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();

  // Nav
  const nav=el('div','cal-nav');
  const prevBtn=el('button','cal-nav-btn','‹');
  prevBtn.onclick=()=>{ let m=month-1,y=year; if(m<0){m=11;y--;} setState({month:m,year:y,selectedDay:null}); };
  const titleEl=el('span','cal-title',`${year}年${month+1}月`);
  const nextBtn=el('button','cal-nav-btn','›');
  nextBtn.onclick=()=>{ let m=month+1,y=year; if(m>11){m=0;y++;} setState({month:m,year:y,selectedDay:null}); };
  nav.append(prevBtn,titleEl,nextBtn);
  wrap.append(nav);

  // Grid
  const grid=el('div','cal-grid');
  const head=el('div','cal-head');
  DAYS.forEach((d,i)=>{ const dd=el('div','cal-head-day',d); dd.style.color=i===0?'#EF4444':i===6?'#3B82F6':'#94A3B8'; head.append(dd); });
  grid.append(head);
  const days=el('div','cal-days');
  for(let i=0;i<firstDay;i++){
    const e=el('div','cal-day'); e.style.cssText='border-right:1px solid #F1F5F9;background:#FAFBFC;'; days.append(e);
  }
  for(let d=1;d<=daysInMonth;d++){
    const key=getDayKey(year,month,d);
    const dd=postData[key];
    const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const isSel=selectedDay===d;
    const col=(firstDay+d-1)%7;
    const maxL=dd?Math.max(...dd.posts.map(p=>p.likes)):0;
    const buzz=getBuzz(maxL);
    const cell=el('div','cal-day');
    cell.style.cssText=`border-right:${col<6?'1px solid #F1F5F9':'none'};border-bottom:1px solid #F1F5F9;background:${isSel?'#EEF2FF':dd?buzz.bg:'#fff'};box-shadow:${isSel?'inset 0 0 0 2px #6C63FF':isToday?'inset 0 0 0 2px #6C63FF66':'none'};`;
    cell.onclick=()=>setState({selectedDay:isSel?null:d});
    const num=el('div','cal-day-num',String(d));
    num.style.cssText=`font-weight:${isToday?700:400};color:${isToday?'#6C63FF':col===0?'#EF4444':col===6?'#3B82F6':'#1a2a3a'};background:${isToday?'#EEF2FF':'transparent'};`;
    cell.append(num);
    if(dd){
      const bz=el('div','cal-day-buzz',buzz.label||`❤️${maxL}`);
      bz.style.color=buzz.color;
      const dots=el('div','cal-day-dots');
      [...new Set(dd.posts.map(p=>p.accountId))].slice(0,3).forEach(aid=>{
        const a=accounts.find(x=>x.id===aid);
        const dot=el('div','cal-day-dot');
        dot.style.background=a?a.color:'#ccc';
        dots.append(dot);
      });
      cell.append(bz,dots);
    }
    days.append(cell);
  }
  grid.append(days);
  wrap.append(grid);

  // Legend
  const leg=el('div','legend');
  leg.append(el('div','legend-title','❤️ いいね数で色が変わる！'));
  const items=el('div','legend-items');
  [['0-10','#CBD5E1'],['11-30','#6C63FF'],['31-100','#F59E0B'],['101-300','#FF8C00'],['301~','#FF4500']].forEach(([l,c])=>{
    const item=el('div','legend-item');
    const dot=el('div','legend-dot'); dot.style.cssText=`background:${c}55;border:1px solid ${c};`; 
    item.append(dot,document.createTextNode(l)); items.append(item);
  });
  leg.append(items);
  wrap.append(leg);

  // Selected day
  if(selectedDay){
    const panel=el('div','card'); panel.style.marginTop='12px';
    const dh=el('div','detail-header');
    dh.append(el('span','detail-title',`${month+1}月${selectedDay}日`));
    const rb=el('button','record-btn','＋ 投稿を記録');
    rb.onclick=()=>setState({showModal:true});
    dh.append(rb); panel.append(dh);
    const dayData=postData[getDayKey(year,month,selectedDay)];
    if(dayData&&dayData.posts.length>0){
      dayData.posts.forEach(post=>{
        const acc=accounts.find(a=>a.id===post.accountId);
        const plat=PLATFORMS.find(p=>p.id===post.platform);
        const bz=getBuzz(post.likes);
        const item=el('div','post-item'); item.style.borderLeft=`3px solid ${acc?acc.color:'#6C63FF'}`;
        const inner=el('div','post-item-inner');
        const left=el('div','post-item-left');
        const icon=el('div','post-item-icon',plat?plat.emoji:''); icon.style.background=(acc?acc.color:'#6C63FF')+'20';
        const info=el('div');
        const name=el('div','post-item-name',`${plat?plat.name:''} · ${acc?acc.name:''}`); name.style.color=acc?acc.color:'#6C63FF';
        const memo=el('div','post-item-memo',(post.content||'投稿')+(post.time?` · ${post.time}`:''));
        info.append(name,memo); left.append(icon,info);
        const right=el('div');
        const likes=el('div','post-item-likes',`❤️ ${post.likes}`); likes.style.color=bz.color;
        right.append(likes);
        if(bz.label){const bl=el('div','post-item-buzz',bz.label);bl.style.color=bz.color;right.append(bl);}
        inner.append(left,right); item.append(inner); panel.append(item);
      });
    }else{ panel.append(el('div','no-post','この日の投稿はまだないよ')); }
    wrap.append(panel);
  }

  // FAB
  if(!selectedDay){
    const fab=el('button','fab','＋');
    fab.onclick=()=>{
      setState({selectedDay:today.getDate(),showModal:true});
    };
    wrap.append(fab);
  }
  return wrap;
}

    const ac=accounts.find(a=>a.id===hmFilter);
    let rgb='108,99,255';

      const hex=ac.color.replace('#','');

    const cell=el('div','hm-cell',cnt>0?String(cnt):'');
    cell.style.cssText=`background:rgba(${rgb},${op});color:${op>0.5?'#fff':'transparent'};`;

  hmc.append(hmGrid);
  const lb=el('div','legend-bar');

  const wr=el('div'); wr.style.cssText='display:flex;gap:6px;';
  wr.append(pill('投稿数',weekMode==='posts','#6C63FF',()=>setState({weekMode:'posts'})));
  wr.append(pill('いいね平均',weekMode==='likes','#6C63FF',()=>setState({weekMode:'likes'})));
  wh.append(wr); wc.append(wh);
  const slots=[
    {label:'深夜\n0-5時', hours:[0,1,2,3,4,5]},
    {label:'朝\n6-9時',   hours:[6,7,8,9]},
    {label:'昼\n10-14時', hours:[10,11,12,13,14]},
    {label:'夕方\n15-18時',hours:[15,16,17,18]},
    {label:'夜\n19-23時', hours:[19,20,21,22,23]},
  ];
  const headRow=el('div','week-grid-row');
  headRow.append(el('div'));

  wc.append(headRow);
  const grid=slots.map(slot=>DAYS.map((_,di)=>{
    const posts=Object.entries(postData).flatMap(([k,v])=>{
      const [y2,m2,d2]=k.split('-').map(Number);
      if(new Date(y2,m2-1,d2).getDay()!==di)return[];
      return v.posts.filter(p=>p.time&&slot.hours.includes(parseInt(p.time)));
    });
    return{count:posts.length,avgLikes:posts.length?Math.round(posts.reduce((s,p)=>s+p.likes,0)/posts.length):0};
  }));
  const maxVal=Math.max(...grid.flat().map(c=>weekMode==='posts'?c.count:c.avgLikes),1);
  slots.forEach((slot,si)=>{
    const row=el('div','week-grid-row');
    const lbl=el('div','week-label',slot.label);
    row.append(lbl);
    grid[si].forEach(cell=>{
      const val=weekMode==='posts'?cell.count:cell.avgLikes;
      const op=val===0?0.06:0.15+(val/maxVal)*0.8;
      const c=el('div','hm-cell',val>0?String(val):'');
      c.style.cssText=`background:rgba(108,99,255,${op});color:${op>0.5?'#fff':'#94A3B8'};`;
      row.append(c);
    });
    wc.append(row);
  });
  const wNote=el('div'); wNote.style.cssText='margin-top:6px;font-size:10px;color:#94A3B8;text-align:center;';
  wNote.textContent=weekMode==='posts'?'色が濃い = 投稿が多い時間帯':'色が濃い = いいね平均が高い時間帯';
  wc.append(wNote);
  wrap.append(wc);

  // Follower graph
  const fc=el('div','card');

  const fpr=el('div','pill-row');
  accounts.forEach(a=>{
    const plat=PLATFORMS.find(p=>p.id===a.platform);
    fpr.append(pill(`${plat?plat.emoji:''} ${a.name}`,fwAccId===a.id,a.color,()=>setState({fwAccId:a.id})));
  });
  fc.append(fpr);
  const fd=state.followerData[fwAccId];
  const acc=accounts.find(a=>a.id===fwAccId);
  if(fd&&acc){
    const plat=PLATFORMS.find(p=>p.id===acc.platform);
    const fNote=el('div','fw-note');
    fNote.style.color=acc.color;
    fNote.innerHTML=`${plat?plat.name:''} ${acc.name}<span class="fw-sub">7週間の推移</span>`;
    fc.append(fNote);
    const fMin=Math.min(...fd.history);
    const fRange=Math.max(...fd.history)-fMin||1;
    const chartDiv=el('div','fw-chart');
    const svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('width','100%'); svg.setAttribute('height','130'); svg.setAttribute('viewBox','0 0 300 130'); svg.setAttribute('preserveAspectRatio','none');
    const defs=document.createElementNS(svgNS,'defs');
    const grad=document.createElementNS(svgNS,'linearGradient');
    grad.setAttribute('id','grad'); grad.setAttribute('x1','0'); grad.setAttribute('y1','0'); grad.setAttribute('x2','0'); grad.setAttribute('y2','1');
    const s1=document.createElementNS(svgNS,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color',acc.color); s1.setAttribute('stop-opacity','0.25');
    const s2=document.createElementNS(svgNS,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color',acc.color); s2.setAttribute('stop-opacity','0.02');
    grad.append(s1,s2); defs.append(grad); svg.append(defs);
    [0,1,2,3].forEach(i=>{ const line=document.createElementNS(svgNS,'line'); line.setAttribute('x1','0'); line.setAttribute('y1',String(15+i*28)); line.setAttribute('x2','300'); line.setAttribute('y2',String(15+i*28)); line.setAttribute('stroke','#F1F5F9'); line.setAttribute('stroke-width','1'); svg.append(line); });
    const pts=fd.history.map((v,i)=>`${i*(300/6)},${115-((v-fMin)/fRange)*95}`);
    const area=document.createElementNS(svgNS,'path');
    area.setAttribute('d',`M ${pts.join(' L ')} L ${6*(300/6)},115 L 0,115 Z`); area.setAttribute('fill','url(#grad)'); svg.append(area);
    const line=document.createElementNS(svgNS,'polyline');
    line.setAttribute('points',pts.join(' ')); line.setAttribute('fill','none'); line.setAttribute('stroke',acc.color); line.setAttribute('stroke-width','2.5'); line.setAttribute('stroke-linejoin','round'); svg.append(line);
    fd.history.forEach((v,i)=>{ const c=document.createElementNS(svgNS,'circle'); c.setAttribute('cx',String(i*(300/6))); c.setAttribute('cy',String(115-((v-fMin)/fRange)*95)); c.setAttribute('r','3.5'); c.setAttribute('fill',i===fd.history.length-1?acc.color:'#fff'); c.setAttribute('stroke',acc.color); c.setAttribute('stroke-width','2'); svg.append(c); });
    chartDiv.append(svg);
    const flbl=el('div','fw-label',`${fd.current.toLocaleString()}<br><span style="font-size:9px;font-weight:400">フォロワー</span>`);
    flbl.style.background=acc.color; chartDiv.append(flbl);
    fc.append(chartDiv);
    const xrow=el('div','fw-xlabel');
    ['Week1','Week2','Week3','Week4','Week5','Week6','Week7'].forEach(l=>xrow.append(el('span','',l)));

    grow.append(gl,gp); gbox.append(grow);
    const bg=el('div','fw-bar-bg');
    const fill=el('div','fw-bar-fill'); fill.style.cssText=`width:${Math.min((fd.current/fd.goal)*100,100)}%;background:linear-gradient(to right,${acc.color},${acc.color}88);`;
    bg.append(fill); gbox.append(bg);
    const gnote=el('div','fw-goal-note',`あと ${(fd.goal-fd.current).toLocaleString()} フォロワーで達成！`);
    gbox.append(gnote); fc.append(gbox);
  }
  wrap.append(fc);

  // Streak
  const sc=el('div','card');
  sc.append(el('div','section-title','🔥 連続投稿ストリーク'));
  const scenter=el('div','streak-center');
  scenter.append(el('div','streak-num',String(state.streak)));
  scenter.append(el('div','streak-label','日連続中！'));
  scenter.append(el('div','streak-best',`最高記録：${state.bestStreak}日`));
  sc.append(scenter);
  const sdots=el('div','streak-dots');
  ['火','水','木','金','土','日','月'].forEach((d,i)=>{
    const wrap2=el('div','streak-dot-wrap');
    const dot=el('div','streak-dot',i<state.streak%7?'✓':'');
    dot.style.cssText=`background:${i<state.streak%7?'#6C63FF':'#F1F5F9'};color:${i<state.streak%7?'#fff':'#CBD5E1'};`;
    wrap2.append(dot,el('div','streak-day',d)); sdots.append(wrap2);
  });
  sc.append(sdots);
  const sbars=el('div','streak-bars');
  [3,5,5,5,4,5,5].forEach((v,i)=>{
    const bw=el('div','streak-bar-wrap');
    const bar=el('div','streak-bar');
    bar.style.cssText=`height:${v*10}px;background:${i===6?'#FF6B35':'#6C63FF'};opacity:${i===6?1:0.55};`;
    bw.append(bar,el('div','streak-bar-label',['月','火','水','木','金','土','日'][i]));
    sbars.append(bw);
  });
  sc.append(sbars);
  sc.append(el('div','streak-msg','🔥 消えないように続けよう！'));
  wrap.append(sc);
  return wrap;
}

  sb.onclick=()=>{
    const {selectedDay,year,month,postData}=state;
    if(!selectedDay)return;
    const key=getDayKey(year,month,selectedDay);
    const existing=postData[key]||{posts:[],followerChange:0};
    const t=state.newPost.time||new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    const newPostData=Object.assign({},postData,{[key]:Object.assign({},existing,{posts:[...existing.posts,{...state.newPost,likes:Number(state.newPost.likes)||0,id:String(Date.now()),time:t}]})});
    const firstAccId=state.accounts[0]?state.accounts[0].id:'acc1';
    setState({postData:newPostData,showModal:false,newPost:{accountId:firstAccId,platform:'threads',likes:'',content:'',time:''}});
  };
  box.append(sb);
  overlay.append(box);
  return overlay;
}

function render(){
  const {view,streak,state:_,accounts}=state;
  const app=document.getElementById('app');
  app.innerHTML='';

  // Header
  const header=el('div','header');
  const htitle=el('div');
  htitle.append(el('div','header-title','PostBoard'));
  htitle.append(el('div','header-sub','SNS投稿管理カレンダー'));
  const hbadges=el('div','header-badges');
  hbadges.append(el('div','badge-fire',`🔥 ${state.streak}日連続`));
  const {year,month,postData}=state;
  const totalPosts=Object.keys(postData).filter(k=>k.startsWith(`${year}-${month+1}`)).reduce((s,k)=>s+postData[k].posts.length,0);
  hbadges.append(el('div','badge-post',`📝 ${totalPosts}投稿`));
  header.append(htitle,hbadges);
  app.append(header);

  // Mascot
  const mascotMsg=state.streak>=7?MASCOT_MESSAGES[2]:state.streak>=3?MASCOT_MESSAGES[1]:MASCOT_MESSAGES[5];
  const mas=el('div','mascot');
  const micon=el('div','mascot-icon');
  micon.append(el('div','mascot-crown','👑'),el('div','mascot-frog','🐸'),el('div','mascot-name','カ・エルデ'));
  const mbubble=el('div','mascot-bubble');
  mbubble.append(el('div','mascot-label','ピョコピョコからひとこと💬'),el('div','mascot-msg',mascotMsg));
  mas.append(micon,mbubble); app.append(mas);

  // View
  if(view==='calendar') app.append(renderCalendar());
  else if(view==='analytics') app.append(renderAnalytics());
  else if(view==='accounts') app.append(renderAccounts());

  // Nav
  const nav=el('div','nav');
  [['calendar','カレンダー','📅'],['analytics','分析','📊'],['accounts','アカウント','👤']].forEach(([v,label,icon])=>{
    const btn=el('button','nav-btn');
    btn.style.color=view===v?'#6C63FF':'#94A3B8';
    btn.style.fontWeight=view===v?700:400;
    btn.append(el('span','nav-icon',icon),document.createTextNode(label));
    btn.onclick=()=>setState({view:v,selectedDay:null});
    nav.append(btn);
  });
  app.append(nav);

  // Modal
  if(state.showModal) app.append(renderModal());
}

render();
</script>
</body>
</html>
